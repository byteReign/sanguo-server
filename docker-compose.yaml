services:
  mysql:
    image: mysql:8.0
    container_name: sanguo-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sanguo_server
      MYSQL_USER: sanguo
      MYSQL_PASSWORD: sanguo123456
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:8
    container_name: sanguo-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  app:
    build: .
    container_name: sanguo-server
    restart: always
    depends_on:
      - mysql
      - redis
    ports:
      - "8080:8080"
    environment:
      DB_DSN: sanguo:sanguo123456@tcp(mysql:3306)/sanguo_server?charset=utf8mb4&parseTime=True&loc=Local
      REDIS_ADDR: redis:6379

volumes:
  mysql_data:
  redis_data: